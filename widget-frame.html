<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Widget</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="course/styles.css">
<style>
  /* the game's palette, so the course widget sits inside the game's modal without a seam
     (html:root[...] outranks the course stylesheet's :root[data-theme] rules) */
  html:root[data-theme="dark"] { --ground: #0e141c; --panel: #0e141c; --panel2: #1a2330; --ink: #e9eef5; --muted: #8d9aab; --line: #243040; --line2: #34445a; --accent: #62b1e0; --accent2: #b0a0cf; --si: #8bbdc1; --cu: #e59a6b; --ok: #5fd6a3; --warn: #f3bd7e; --bad: #f2705f; --shadow: none; --serif: "Inter", system-ui, sans-serif; --sans: "Bricolage Grotesque", "Inter", system-ui, sans-serif; }
  html, body { margin: 0; background: var(--ground) !important; }
  html:root[data-theme="dark"] body { font-family: "Inter", system-ui, sans-serif; color: var(--ink); }
  body { padding: 10px 12px 16px; }
  .widget { background: var(--panel) !important; border-color: var(--line) !important; }
  .article { max-width: none; margin: 0; }
  .widget { margin: 0; }
  #err { color: var(--bad); font-family: var(--sans); font-size: 13px; }
</style>
</head>
<body>
<div class="article"><div class="widget" id="box"></div><div id="err"></div></div>
<script src="course/widget-layout.js"></script>
<script>window.COURSE = { parts: [], modules: [], built: '' };</script>
<script src="challenges.js"></script>
<script>
(function () {
  const params = new URLSearchParams(location.search);
  const id = params.get('w'); const theme = params.get('t') || 'dark';
  document.documentElement.setAttribute('data-theme', theme);
  const registry = {};
  window.registerWidget = (idd, def) => { registry[idd] = def; };
  const themeListeners = new Set();
  function mk(el, attrs, kids) {
    if (attrs) for (const k in attrs) { const v = attrs[k];
      if (k === 'class') el.setAttribute('class', v);
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'on') for (const ev in v) el.addEventListener(ev, v[ev]);
      else if (k === 'html') el.innerHTML = v;
      else if (v != null) el.setAttribute(k, v); }
    for (const kid of kids.flat()) if (kid != null) el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
    return el;
  }
  const ctxBase = {
    tokens() { const cs = getComputedStyle(document.documentElement); const g = n => cs.getPropertyValue('--' + n).trim();
      return { ink: g('ink'), muted: g('muted'), ground: g('ground'), panel: g('panel'), panel2: g('panel2'), line: g('line'), line2: g('line2'), accent: g('accent'), accent2: g('accent2'), si: g('si'), cu: g('cu'), euv: g('accent2'), ok: g('ok'), warn: g('warn'), bad: g('bad') }; },
    fmt(n, d) { if (n == null || !isFinite(n)) return '–'; return Number(n).toLocaleString('en-US', { maximumFractionDigits: d == null ? 2 : d }).replace(/,/g, ' '); },
    h(tag, attrs, ...kids) { return mk(document.createElement(tag), attrs, kids); },
    svg(tag, attrs, ...kids) { return mk(document.createElementNS('http://www.w3.org/2000/svg', tag), attrs, kids); },
    onTheme(fn) { themeListeners.add(fn); }
  };
  const post = msg => { try { parent.postMessage(Object.assign({ type: 'sg-widget', id }, msg), '*'); } catch (e) {} };
  function mount() {
    const def = registry[id]; const box = document.getElementById('box');
    if (!def) { box.textContent = 'Widget not available: ' + id; post({ error: 'missing' }); return; }
    box.append(ctxBase.h('div', { class: 'widget-head' }, ctxBase.h('h4', null, def.title || id), ctxBase.h('span', { class: 'tag' }, 'Interactive')));
    if (def.caption) box.append(ctxBase.h('div', { class: 'widget-cap' }, def.caption));
    const body = ctxBase.h('div', { class: 'widget-body' }); box.append(body);
    try { def.mount(body, ctxBase); window.prepareWidgetDiagrams(body); } catch (e) { document.getElementById('err').textContent = e.message; post({ error: e.message }); }
    // interaction counter for exploration-only goals
    let clicks = 0; box.addEventListener('click', () => { clicks++; }, true); box.addEventListener('input', () => { clicks++; }, true); box.addEventListener('change', () => { clicks++; }, true);
    const ch = window.SG_CHALLENGES && window.SG_CHALLENGES[id];
    post({ ready: true, goal: ch ? ch.goal : null });
    if (!ch) return;
    let wasDone = false;
    setInterval(() => {
      let done = false, detail = '';
      try { const r = ch.check(box, { clicks, ...window.SG_CHALLENGE_UTILS }); if (typeof r === 'object' && r) { done = !!r.done; detail = r.detail || ''; } else done = !!r; } catch (e) { detail = e.message; }
      if (done !== wasDone || detail) { wasDone = done; post({ done, detail }); }
    }, 400);
    window.addEventListener('message', ev => { if (ev.data && ev.data.type === 'sg-theme') { document.documentElement.setAttribute('data-theme', ev.data.theme); themeListeners.forEach(fn => fn()); } });
  }
  const s = document.createElement('script'); s.src = 'course/widgets/' + id + '.js'; s.onload = mount; s.onerror = () => { document.getElementById('err').textContent = 'Could not load widget ' + id; post({ error: 'load' }); };
  document.body.append(s);
})();
</script>
</body>
</html>
