<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sand to GPU: Foundry</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="course/section-figures.css">
<link rel="stylesheet" href="game.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-cap" viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c0 1.5 3 3 6 3s6-1.5 6-3v-5"/><path d="M22 9v6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 3l10 18H2z"/><path d="M12 10v4M12 17.5h.01"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M4 4h7a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H4z"/><path d="M20 4h-7a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h8z"/></symbol>
    <symbol id="i-compass" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 9l-2 6-4 2 2-6z"/></symbol>
    <symbol id="i-flask" viewBox="0 0 24 24"><path d="M9 3h6M10 3v6L4 20h16l-6-11V3"/><path d="M7 15h10"/></symbol>
    <symbol id="i-ruler" viewBox="0 0 24 24"><path d="M3 17L17 3l4 4L7 21z"/><path d="M7 13l2 2M10 10l2 2M13 7l2 2"/></symbol>
    <symbol id="i-building" viewBox="0 0 24 24"><path d="M3 21h18M5 21V7l7-4 7 4v14M9 21v-4h6v4"/><path d="M9 10h.01M15 10h.01M9 14h.01M15 14h.01"/></symbol>
    <symbol id="i-puzzle" viewBox="0 0 24 24"><path d="M10 3a2 2 0 0 1 4 0v2h4v4a2 2 0 0 1 0 4v4h-4v-2a2 2 0 0 0-4 0v2H6v-4a2 2 0 0 0 0-4V5h4z"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><path d="M6 11V8a6 6 0 0 1 12 0v3"/><rect x="5" y="11" width="14" height="10" rx="2"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M15 9.5c0-1-1.5-1.5-3-1.5S9 8.5 9 9.5s1.5 1.5 3 1.5 3 .5 3 1.5-1.5 1.5-3 1.5-3-.5-3-1.5"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></symbol>
    <symbol id="i-hourglass" viewBox="0 0 24 24"><path d="M6 2h12M6 22h12M7 2c0 6 5 6 5 10s-5 4-5 10M17 2c0 6-5 6-5 10s5 4 5 10"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></symbol>
    <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 21h8M12 17v4M7 4h10v6a5 5 0 0 1-10 0z"/><path d="M7 6H4a3 3 0 0 0 3 3M17 6h3a3 3 0 0 1-3 3"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></symbol>
    <symbol id="i-help" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.7.4-1 1-1 1.7M12 17h.01"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></symbol>
    <symbol id="i-chip" viewBox="0 0 24 24"><rect x="8" y="8" width="8" height="8" rx="1"/><path d="M4 10h4M4 14h4M16 10h4M16 14h4M10 4v4M14 4v4M10 16v4M14 16v4"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M6 4l14 8-14 8z"/></symbol>
    <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4h11l-1 4 1 4H5"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.8 5.9 6.4.8-4.7 4.4 1.2 6.4L12 17.5l-5.7 3 1.2-6.4L2.8 9.7l6.4-.8z"/></symbol>
    <symbol id="i-news" viewBox="0 0 24 24"><path d="M4 5h13v14H4zM17 8h3v9a2 2 0 0 1-2 2H6"/><path d="M7 9h7M7 12h7M7 15h4"/></symbol>
  </defs>
</svg>

<header class="top">
  <div class="brand"><a href="https://github.com/DicksonWu654/sand-to-gpu" target="_blank" rel="noopener" title="The course this game is built from">Sand to GPU</a><b>Foundry</b></div>
  <div class="tiles">
    <div class="tile"><span class="tile-l">Day</span><span class="tile-v" id="h-day">0</span></div>
    <div class="tile cash"><span class="tile-l">Cash</span><span class="tile-v" id="h-cash">$0</span><span class="tile-s" id="h-income">+$0/day</span></div>
    <div class="tile"><span class="tile-l">D0 defects/cm²</span><span class="tile-v" id="h-d0">0.500</span><span class="tile-s" id="h-node">N5</span></div>
    <div class="tile"><span class="tile-l">Knowledge</span><span class="tile-v" id="h-know">0/176</span></div>
    <div class="tile"><span class="tile-l">Multiplier</span><span class="tile-v" id="h-mult">×1.00</span><span class="tile-s" id="h-events"></span></div>
  </div>
  <div class="tools">
    <label class="speed">Speed <select id="speed"><option value="0">⏸</option><option value="1" selected>1×</option><option value="3">3×</option><option value="10">10×</option></select></label>
    <button id="btn-study" class="btn"><svg class="ic"><use href="#i-cap"/></svg>Study Hall</button>
    <button id="btn-risk" class="btn"><svg class="ic"><use href="#i-alert"/></svg>Risk</button>
    <button id="btn-help" class="btn ghost icon" title="How to play"><svg class="ic"><use href="#i-help"/></svg></button>
    <button id="btn-reset" class="btn ghost icon" title="Reset the game"><svg class="ic"><use href="#i-reset"/></svg></button>
  </div>
</header>

<div class="objective">
  <span class="obj-tag" id="obj-tag">NEXT</span>
  <div class="obj-body"><div id="obj-text" class="obj-text"></div></div>
  <div class="obj-meter"><div class="obj-bar"><div id="obj-fill" class="obj-fill"></div></div><span id="obj-sub" class="obj-sub"></span></div>
  <div id="minimap" class="minimap" title="The chain: click a station to scroll to it"></div>
</div>

<main>
  <section class="chain-wrap"><div id="chain" class="chain"></div></section>
  <section class="panels">
    <div class="panel">
      <h3>Warehouse &amp; markets</h3>
      <p class="small muted">Auto keeps a 30-day warehouse for the next station and sells the surplus on the spot market. The last station's output is always sold.</p>
      <div id="resources"></div>
    </div>
    <div class="panel side">
      <div class="side-tabs"><button class="side-tab sel" data-pane="log">Log</button><button class="side-tab" data-pane="achievements">Achievements</button></div>
      <div id="log" class="side-pane show"></div>
      <div id="achievements" class="side-pane"></div>
    </div>
  </section>
</main>

<div id="modal" class="modal"></div>
<div id="toasts" class="toasts"></div>

<script src="generated/quiz-data.js"></script>
<script src="generated/figures.js"></script>
<script src="data.js"></script>
<script src="missions.js"></script>
<script src="labs.js"></script>
<script src="mission-runner.js"></script>
<script src="engine.js"></script>
</body>
</html>
